# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

schema_version: 1

context:
  version: "1.37.1"

recipe:
  name: kubernetes
  version: ${{ version }}

source:
  - if: not win
    then:
      url: https://github.com/kubernetes/kubernetes/archive/v${{ version }}.tar.gz
      sha256: 89295ac375eb0fdfe68a0696d81be615771d6b27c7ad9bb675dc6ffd0d2ce5f3
    else:
      url: https://dl.k8s.io/v${{ version }}/kubernetes-node-windows-amd64.tar.gz
      sha256: a7a3cb45c7f7de3d9a60c3368072040b13ba9320c46b11bb8844088b1096ba0d

build:
  number: 0
  skip:
    - osx and not arm64
    - ppc64le

outputs:
  - package:
      name: kubernetes-client
    build:
      dynamic_linking:
        binary_relocation: false
      script:
        - if: win
          then: client/bld.bat
          else: client/build.sh
    requirements:
      build:
        - if: unix
          then:
            - ${{ stdlib("c") }}
            - ${{ compiler('cgo') }} >=1.26
            - ${{ compiler('c') }}
            - bash >=4.2
            - make
            - rsync
            - jq
    tests:
      - script:
          - kubectl --help
    about:
      license: Apache-2.0
      license_file:
        - if: win
          then: LICENSES/
          else: LICENSE
      summary: Kubernetes client binaries

  - package:
      name: kubernetes-node
    build:
      dynamic_linking:
        binary_relocation: false
      script:
        - if: win
          then: node/bld.bat
          else: node/build.sh
    requirements:
      build:
        - if: unix
          then:
            - ${{ stdlib("c") }}
            - ${{ compiler('cgo') }} >=1.26
            - ${{ compiler('c') }}
            - bash >=4.2
            - make
            - rsync
            - jq
    tests:
      - script:
          - kubeadm --help
          - kubelet --help
          - kube-proxy --help
    about:
      license: Apache-2.0
      license_file:
        - if: win
          then: LICENSES/
          else: LICENSE
      summary: Kubernetes node binaries

  - package:
      name: kubernetes-server
    build:
      skip: not unix
      dynamic_linking:
        binary_relocation: false
      script: server/build.sh
    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler('cgo') }} >=1.26
        - ${{ compiler('c') }}
        - bash >=4.2
        - make
        - rsync
        - jq
      run:
        - ${{ pin_subpackage('kubernetes-node', exact=true) }}
    tests:
      - script:
          - kube-apiserver --help
          - kube-controller-manager --help
          - kube-scheduler --help
          - test -x "${PREFIX}/bin/mounter"
    about:
      license: Apache-2.0
      license_file: LICENSE
      summary: Kubernetes server binaries

  - package:
      name: kubernetes
    requirements:
      run:
        - ${{ pin_subpackage('kubernetes-client', exact=true) }}
        - ${{ pin_subpackage('kubernetes-node', exact=true) }}
        - if: unix
          then: ${{ pin_subpackage('kubernetes-server', exact=true) }}
    tests:
      - script:
          - kubectl
          - kubelet --help
          - kube-proxy --help
          - kubeadm --help
          - if: unix
            then:
              - kube-apiserver --help
              - kube-controller-manager --help
              - kube-scheduler --help
about:
  homepage: https://www.kubernetes.io
  license: Apache-2.0
  license_file:
    - if: win
      then: LICENSES/
      else: LICENSE
  summary: Production-Grade Container Orchestration
  documentation: https://docs.kubernetes.io
  repository: https://github.com/kubernetes/kubernetes

extra:
  recipe-maintainers:
    - mxr-conda
    - sodre
    - dhirschfeld
    - janjagusch
